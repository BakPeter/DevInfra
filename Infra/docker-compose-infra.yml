name: infra

services:
  db-files-s3:
    image: minio/minio:${MINIO_IMG_TAG}
    container_name: db-files-s3-minio
    hostname: minio
    command: server /data --console-address ":9001"
    volumes:
      - ${MOUNT_DATA}/db-files-s3/minio:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - 9004:9000
      - 9005:9001
    networks:
      - infra-net
    restart: always

  # Postgres #
  postgres:
    image: postgres:${POSTGRES_IMG_TAG}
    container_name: postgres
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ${MOUNT_DATA}/postgres:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - infra-net
    restart: always

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_IMG_TAG}
    container_name: pgadmin
    # Runs as root so the bind-mounted data dir does not need uid 5050 ownership.
    user: root
    ports:
      - ${PGADMIN_PORT}:80
    volumes:
      - ${MOUNT_DATA}/pgadmin:/var/lib/pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_LISTEN_PORT=80
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infra-net
    restart: always

  # ELK #
  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_IMG_TAG}
    ports:
      - 9200:9200
    volumes:
      - ${MOUNT_DATA}/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - infra-net
    deploy:
      resources:
        limits:
          memory: 5G
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
    restart: always

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:${ELK_IMG_TAG}
    ports:
      - 5601:5601
    volumes:
      # - certs:/usr/share/kibana/config/certs
      - ${MOUNT_DATA}/kibana:/usr/share/kibana/data
    networks:
      - infra-net
    deploy:
      resources:
        limits:
          memory: 1G
    restart: always

  # Kafka #
  kafka-broker:
    image: confluentinc/cp-kafka:${KAFKA_IMG_TAG}
    container_name: kafka-broker
    ports:
      - '9092:9092'
    depends_on:
      - zookeeper
    volumes:
      - ${MOUNT_DATA}/kafka:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_IP}:9092,PLAINTEXT_INTERNAL://kafka-broker:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - infra-net
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:${KAFKA_IMG_TAG}
    container_name: zookeeper
    volumes:
      - ${MOUNT_DATA}/zookeeper/data:/var/lib/zookeeper/data
      - ${MOUNT_DATA}/zookeeper/log:/var/lib/zookeeper/log
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - infra-net
    restart: always

  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_IMG_TAG}
    container_name: kafka-ui
    ports:
      - ${KAFKA_UI_PORT}:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: 'local'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka-broker:29092'
    depends_on:
      kafka-broker:
        condition: service_healthy
    networks:
      - infra-net
    restart: always

  seq:
    image: datalust/seq:${SEQ_IMG_TAG}
    container_name: seq
    ports:
      - ${SEQ_PORT}:80
    volumes:
      - ${MOUNT_DATA}/seq:/data
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_FIRSTRUN_ADMINPASSWORD}
    networks:
      - infra-net
    restart: always

  service-nodejs:
    build:
      context: ../Services/service-nodejs
      dockerfile: Dockerfile
    container_name: service-nodejs
    ports:
      - ${NODEJS_SERVICE_REST_PORT}:${NODEJS_SERVICE_REST_PORT}
    environment:
      - NODEJS_SERVICE_REST_PORT=${NODEJS_SERVICE_REST_PORT}
      - SEQ_SERVER_URL=http://seq
      - KAFKA_BOOTSTRAP_SERVERS=kafka-broker:29092
      - KAFKA_TOPIC_ITEMS=${KAFKA_TOPIC_ITEMS}
      - KAFKA_TOPIC_ITEMS_NODEJS_SERVICE=${KAFKA_TOPIC_ITEMS_NODEJS_SERVICE}
      - KAFKA_TOPIC_ITEMS_PYTHON_SERVICE=${KAFKA_TOPIC_ITEMS_PYTHON_SERVICE}
      - KAFKA_CONSUMER_GROUP_ID=${KAFKA_CONSUMER_GROUP_ID}
      - NODEJS_SERVICE_KAFKA_CONSUMER_TOPICS=${NODEJS_SERVICE_KAFKA_CONSUMER_TOPICS}
      - KAFKA_TOPIC_STATE_NODEJS_SERVICE=${KAFKA_TOPIC_STATE_NODEJS_SERVICE}
      - NODEJS_SERVICE_STATE_INTERVAL_SECONDS=${NODEJS_SERVICE_STATE_INTERVAL_SECONDS}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_SCHEMA=${POSTGRES_SCHEMA_NODEJS_SERVICE}
    depends_on:
      kafka-broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - infra-net
    restart: always

  service-python:
    build:
      context: ../Services/service-python
      dockerfile: Dockerfile
    container_name: service-python
    ports:
      - ${PYTHON_SERVICE_REST_PORT}:${PYTHON_SERVICE_REST_PORT}
    environment:
      - PYTHON_SERVICE_REST_PORT=${PYTHON_SERVICE_REST_PORT}
      - SEQ_SERVER_URL=http://seq
      - KAFKA_BOOTSTRAP_SERVERS=kafka-broker:29092
      - KAFKA_TOPIC_ITEMS=${KAFKA_TOPIC_ITEMS}
      - KAFKA_TOPIC_ITEMS_PYTHON_SERVICE=${KAFKA_TOPIC_ITEMS_PYTHON_SERVICE}
      - KAFKA_TOPIC_STATE_PYTHON_SERVICE=${KAFKA_TOPIC_STATE_PYTHON_SERVICE}
      - PYTHON_SERVICE_STATE_INTERVAL_SECONDS=${PYTHON_SERVICE_STATE_INTERVAL_SECONDS}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_SCHEMA=${POSTGRES_SCHEMA_PYTHON_SERVICE}
    depends_on:
      kafka-broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - infra-net
    restart: always

  service-dotnet:
    build:
      context: ../Services/service-dotnet
      dockerfile: Dockerfile
    container_name: service-dotnet
    ports:
      - ${DOTNET_SERVICE_REST_PORT}:${DOTNET_SERVICE_REST_PORT}
    environment:
      - ASPNETCORE_URLS=http://+:${DOTNET_SERVICE_REST_PORT}
      - SEQ_SERVER_URL=http://seq
      - KAFKA_BOOTSTRAP_SERVERS=kafka-broker:29092
      - KAFKA_TOPIC_STATE_DOTNET_SERVICE=${KAFKA_TOPIC_STATE_DOTNET_SERVICE}
      - DOTNET_SERVICE_STATE_INTERVAL_SECONDS=${DOTNET_SERVICE_STATE_INTERVAL_SECONDS}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_SCHEMA=${POSTGRES_SCHEMA_DOTNET_SERVICE}
    depends_on:
      kafka-broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - infra-net
    restart: always

networks:
  infra-net:
    driver: bridge
    name: infra-net
