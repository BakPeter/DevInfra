services:
  db-files-s3:
    image: minio/minio:latest
    container_name: db-files-s3-minio
    hostname: minio
    command: server /data --console-address ":9001"
    volumes:
      - ${MOUNT_DATA}/db-files-s3/minio:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - 9004:9000
      - 9005:9001
    networks:
      - infra-net
    restart: always

  # ELK #
  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.4
    ports:
      - 9200:9200
    volumes:
      - ${MOUNT_DATA}/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - infra-net
    deploy:
      resources:
        limits:
          memory: 5G
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
    restart: always

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:9.4.4
    ports:
      - 5601:5601
    volumes:
      # - certs:/usr/share/kibana/config/certs
      - ${MOUNT_DATA}/kibana:/usr/share/kibana/data
    networks:
      - infra-net
    deploy:
      resources:
        limits:
          memory: 1G
    restart: always

  # Kafka #
  kafka-broker:
    image: confluentinc/cp-kafka:${KAFKA_IMG_TAG}
    container_name: kafka-broker
    ports:
      - '9092:9092'
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_IP}:9092,PLAINTEXT_INTERNAL://kafka-broker:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_REPLICATION_FACTOR: 1
    networks:
      - infra-net
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:${KAFKA_IMG_TAG}
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - infra-net
    restart: always

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - ${KAFKA_UI_PORT}:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: 'local'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka-broker:29092'
    depends_on:
      - kafka-broker
    networks:
      - infra-net
    restart: always

  seq:
    image: datalust/seq:latest
    container_name: seq
    ports:
      - ${SEQ_PORT}:80
    volumes:
      - ${MOUNT_DATA}/seq:/data
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_FIRSTRUN_ADMINPASSWORD}
    networks:
      - infra-net
    restart: always

  service-nodejs:
    build:
      context: ../Services/service-nodejs
      dockerfile: Dockerfile
    container_name: service-nodejs
    ports:
      - ${NODEJS_SERVICE_REST_PORT}:${NODEJS_SERVICE_REST_PORT}
    environment:
      - NODEJS_SERVICE_REST_PORT=${NODEJS_SERVICE_REST_PORT}
      - SEQ_SERVER_URL=http://seq
      - KAFKA_BOOTSTRAP_SERVERS=kafka-broker:29092
      - KAFKA_TOPIC_ITEMS=${KAFKA_TOPIC_ITEMS}
      - KAFKA_TOPIC_ITEMS_NODEJS_SERVICE=${KAFKA_TOPIC_ITEMS_NODEJS_SERVICE}
      - KAFKA_TOPIC_ITEMS_PYTHON_SERVICE=${KAFKA_TOPIC_ITEMS_PYTHON_SERVICE}
      - KAFKA_CONSUMER_GROUP_ID=${KAFKA_CONSUMER_GROUP_ID}
      - NODEJS_SERVICE_KAFKA_CONSUMER_TOPICS=${NODEJS_SERVICE_KAFKA_CONSUMER_TOPICS}
    depends_on:
      - kafka-broker
      - seq
    networks:
      - infra-net
    restart: always

  service-python:
    build:
      context: ../Services/service-python
      dockerfile: Dockerfile
    container_name: service-python
    ports:
      - ${PYTHON_SERVICE_REST_PORT}:${PYTHON_SERVICE_REST_PORT}
    environment:
      - PYTHON_SERVICE_REST_PORT=${PYTHON_SERVICE_REST_PORT}
      - SEQ_SERVER_URL=http://seq
      - KAFKA_BOOTSTRAP_SERVERS=kafka-broker:29092
      - KAFKA_TOPIC_ITEMS=${KAFKA_TOPIC_ITEMS}
      - KAFKA_TOPIC_ITEMS_PYTHON_SERVICE=${KAFKA_TOPIC_ITEMS_PYTHON_SERVICE}
    depends_on:
      - kafka-broker
      - seq
    networks:
      - infra-net
    restart: always

networks:
  infra-net:
    # driver: bridge
    name: infra-net
    external: true
